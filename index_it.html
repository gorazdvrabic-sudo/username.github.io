<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Villa Mare – appartamenti Olive e Lavender a Karigador, Istria." />
  <meta name="theme-color" content="#152c39" />
  <title>Villa Mare | Appartamenti Olive & Lavender</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root{
      --navy:#152c39;
      --navy-2:#1f3d4d;
      --gold:#c7a66a;
      --gold-soft:#efe2c1;
      --ivory:#f7f5f1;
      --stone:#efebe5;
      --ink:#1b2a32;
      --muted:#5f6d76;
      --white:#fff;
      --line:rgba(21,44,57,0.10);
      --shadow:0 20px 50px rgba(19,35,43,0.08);
      --radius-xl:26px;
      --radius-lg:18px;
      --radius-md:14px;
      --container:1180px;
      --heading:"Cormorant Garamond", Georgia, serif;
      --body:"Inter", Arial, sans-serif;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:#f6f4f1;
      color:var(--ink);
      font-family:var(--body);
      line-height:1.7;
    }
    img{max-width:100%;display:block}
    a{text-decoration:none;color:inherit}
    button{font:inherit}
    .container{
      width:min(var(--container), calc(100% - 32px));
      margin-inline:auto;
    }

    .lang-switcher{
      position:fixed;
      top:18px;
      left:18px;
      z-index:9999;
      display:flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border-radius:999px;
      background:rgba(255,255,255,0.18);
      border:1px solid rgba(255,255,255,0.12);
      box-shadow:0 10px 25px rgba(0,0,0,0.12);
      backdrop-filter:blur(10px);
    }
    .lang-switcher a{
      width:34px;height:34px;border-radius:50%;
      overflow:hidden;
      border:2px solid transparent;
      display:grid;place-items:center;
      background:rgba(255,255,255,0.1);
      transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .lang-switcher a:hover,
    .lang-switcher a:focus-visible{
      transform:translateY(-1px);
      border-color:rgba(255,255,255,0.9);
      box-shadow:0 0 0 3px rgba(255,255,255,0.08);
      outline:none;
    }
    .lang-switcher a.active{
      border-color:rgba(255,255,255,1);
      box-shadow:0 0 0 3px rgba(255,255,255,0.10);
    }
    .lang-switcher img{
      width:100%;height:100%;object-fit:cover;display:block;
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:30;
      background:rgba(21,44,57,0.88);
      border-bottom:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(10px);
    }
    .topbar nav{
      display:flex;justify-content:center;flex-wrap:wrap;gap:6px;
      padding:12px 0;
    }
    .topbar a{
      color:rgba(255,255,255,0.88);
      font-size:0.83rem;
      font-weight:500;
      letter-spacing:0.02em;
      padding:8px 12px;
      border-radius:999px;
      transition:background .2s ease, color .2s ease;
    }
    .topbar a:hover,
    .topbar a:focus-visible{
      background:rgba(255,255,255,0.06);
      outline:none;
    }

    .hero{
      position:relative;
      min-height:660px;
      background:
        linear-gradient(120deg, rgba(19,36,44,0.72), rgba(12,29,36,0.52)),
        url("images/hero.png") center/cover no-repeat;
      display:grid;place-items:center;
      overflow:hidden;
    }
    .hero::before{
      content:"";
      position:absolute;inset:0;
      background:radial-gradient(circle at top right, rgba(199,166,106,0.18), transparent 28%);
    }
    .hero-inner{
      position:relative;
      z-index:1;
      width:min(var(--container), calc(100% - 32px));
      display:grid;
      grid-template-columns:1.5fr 0.7fr;
      align-items:center;
      gap:38px;
      padding:95px 0 72px;
    }
    .eyebrow{
      display:inline-block;
      color:#edf5fb;
      background:rgba(255,255,255,0.07);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:999px;
      padding:7px 12px;
      font-size:0.66rem;
      font-weight:700;
      letter-spacing:0.14em;
      text-transform:uppercase;
      margin-bottom:18px;
    }
    h1,h2,h3{
      font-family:var(--heading);
      color:var(--navy);
      line-height:0.98;
      margin:0 0 12px;
      letter-spacing:-0.03em;
    }
    .hero h1{
      font-size:clamp(2.8rem, 4vw, 5rem);
      color:var(--white);
      max-width:640px;
      text-shadow:0 14px 30px rgba(0,0,0,0.18);
    }
    .hero p{
      margin:0;
      max-width:680px;
      color:rgba(255,255,255,0.84);
      font-size:1rem;
    }
    .cta-row{
      display:flex;flex-wrap:wrap;gap:12px;margin-top:24px;
    }
    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      padding:13px 18px;
      border-radius:12px;
      font-weight:700;
      transition:transform .2s ease, box-shadow .2s ease;
    }
    .btn:hover,.btn:focus-visible{
      transform:translateY(-1px);
      outline:none;
    }
    .btn-primary{
      background:linear-gradient(135deg, var(--gold), #b98d4d);
      color:var(--navy);
      box-shadow:0 18px 28px rgba(199,166,106,0.24);
    }
    .btn-secondary{
      color:var(--white);
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.18);
    }

    .hero-card{
      justify-self:end;
      width:min(100%, 340px);
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:22px;
      padding:22px 20px;
      backdrop-filter:blur(10px);
      box-shadow:0 18px 36px rgba(0,0,0,0.12);
    }
    .hero-card .label{
      color:rgba(255,255,255,0.7);
      text-transform:uppercase;
      letter-spacing:0.12em;
      font-size:0.62rem;
      font-weight:700;
      margin-bottom:10px;
    }
    .hero-card h3{
      font-size:clamp(1.65rem, 2vw, 2.2rem);
      color:var(--white);
      margin-bottom:14px;
    }
    .hero-card ul{
      list-style:none;margin:0;padding:0;display:grid;gap:10px;
    }
    .hero-card li{
      display:flex;align-items:center;gap:12px;
      color:rgba(255,255,255,0.9);
      font-size:0.95rem;
    }
    .dot{
      width:9px;height:9px;border-radius:50%;
      background:linear-gradient(180deg,#f0d79d,#d7a95f);
      box-shadow:0 0 0 6px rgba(199,166,106,0.10);
      flex-shrink:0;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(4, minmax(0,1fr));
      gap:16px;
      width:min(var(--container), calc(100% - 32px));
      margin:-32px auto 0;
      position:relative;z-index:2;
    }
    .stat{
      background:rgba(255,255,255,0.85);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:18px 14px;
      text-align:center;
    }
    .stat strong{
      display:block;
      font-family:var(--heading);
      font-size:clamp(1.8rem, 2.5vw, 2.8rem);
      color:var(--navy);
      line-height:1;
      margin-bottom:8px;
    }
    .stat span{
      color:var(--muted);
      font-size:0.77rem;
      font-weight:600;
      letter-spacing:0.05em;
      text-transform:uppercase;
    }

    main{
      padding:68px 0 84px;
    }
    section{
      margin-top:52px;
    }
    .intro{
      max-width:780px;
      margin-inline:auto;
      text-align:center;
      margin-bottom:18px;
    }
    .intro h2{
      font-size:clamp(2.3rem, 2.5vw, 3.2rem);
      margin-bottom:8px;
      color:var(--navy);
    }
    .intro p{
      margin:0;
      color:var(--muted);
      font-size:1rem;
    }

    .panel{
      background:rgba(255,255,255,0.68);
      border:1px solid var(--line);
      border-radius:var(--radius-xl);
      box-shadow:0 14px 30px rgba(17,33,39,0.04);
      padding:22px;
    }
    .highlight{
      margin:0 0 18px;
      padding:16px 18px;
      text-align:center;
      border-radius:14px;
      background:rgba(199,166,106,0.08);
      border:1px solid rgba(199,166,106,0.18);
      color:var(--navy);
      font-weight:700;
      font-size:0.95rem;
    }

    .card-grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:20px;
    }
    .card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:20px;
      padding:24px;
      box-shadow:0 10px 28px rgba(17,33,39,0.03);
    }
    .card h3{
      font-size:clamp(1.7rem, 2vw, 2.2rem);
      color:var(--navy);
      margin-bottom:10px;
    }
    .card p,
    .card li,
    .faq-item p,
    .contact-box p{
      color:var(--muted);
      margin:0;
    }
    .card ul{
      margin:14px 0 0;
      padding-left:18px;
      display:grid;
      gap:8px;
    }

    .badges{
      display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 14px;
    }
    .badge{
      display:inline-block;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(23,58,77,0.10);
      background:rgba(23,58,77,0.03);
      color:var(--navy);
      font-size:0.68rem;
      font-weight:700;
      letter-spacing:0.04em;
      text-transform:uppercase;
    }

    .gallery-grid,
    .gallery-row{
      display:grid;
      gap:18px;
      margin-top:20px;
    }
    .gallery-grid{
      grid-template-columns:repeat(2, minmax(0, 1fr));
    }
    .gallery-row{
      grid-template-columns:repeat(1, minmax(0, 1fr));
      max-width:620px;
      margin-inline:auto;
    }
    .gallery-card{
      position:relative;
      display:block;
      width:100%;
      padding:0;
      border:none;
      background:none;
      overflow:hidden;
      border-radius:18px;
      cursor:pointer;
      box-shadow:0 16px 28px rgba(16,42,56,0.08);
      border:1px solid var(--line);
      transition:transform .2s ease, box-shadow .2s ease;
    }
    .gallery-card:hover,
    .gallery-card:focus-visible{
      transform:translateY(-2px);
      box-shadow:0 20px 32px rgba(16,42,56,0.10);
      outline:none;
    }
    .gallery-card img{
      width:100%;
      height:330px;
      object-fit:cover;
      display:block;
    }
    .gallery-card__overlay{
      position:absolute;
      inset:auto 0 0 0;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:14px 16px;
      background:linear-gradient(180deg, rgba(10,20,24,0), rgba(10,20,24,0.58) 55%, rgba(10,20,24,0.82));
      color:var(--white);
    }
    .gallery-card__overlay strong{
      display:block;
      font-size:clamp(1.4rem, 2vw, 1.8rem);
      font-family:var(--heading);
      line-height:1;
    }
    .gallery-card__overlay span{
      font-size:0.7rem;
      letter-spacing:0.08em;
      text-transform:uppercase;
      opacity:0.9;
    }

    .faq{
      display:grid;
      gap:16px;
    }
