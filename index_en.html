  <style>
    :root{
      --navy:#102a38;
      --navy-2:#173a4d;
      --gold:#c9a970;
      --gold-soft:#f4e6c0;
      --ivory:#f7f3ee;
      --stone:#efeae2;
      --ink:#1d2a32;
      --muted:#536d78;
      --white:#ffffff;
      --line:rgba(16,42,56,.14);
      --shadow:0 24px 60px rgba(8,18,25,.12);
      --radius-xl:28px;
      --radius-lg:18px;
      --radius-md:14px;
      --container:1180px;
      --heading:"Cormorant Garamond","Georgia",serif;
      --body:"Inter","Segoe UI",sans-serif;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:90px}
    body{
      margin:0;
      background:linear-gradient(180deg,#f5f1ea,#f0ece6);
      color:var(--ink);
      font-family:var(--body);
      line-height:1.6;
    }
    img{max-width:100%;display:block}
    a{text-decoration:none;color:inherit}
    button{font:inherit}
    :focus-visible{
      outline:3px solid #e7b958;
      outline-offset:3px;
    }
    .container{
      width:min(var(--container), calc(100% - 32px));
      margin-inline:auto;
    }
    .skip-link{
      position:absolute;
      left:-9999px;
      top:auto;
    }
    .skip-link:focus{
      left:16px;
      top:12px;
      z-index:2000;
      background:#fff;
      padding:10px 14px;
      border-radius:999px;
      box-shadow:var(--shadow);
    }

    .lang-switcher{
      position:fixed;
      top:16px;
      left:16px;
      z-index:60;
      display:flex;
      gap:6px;
      padding:6px;
      border-radius:999px;
      background:rgba(16,42,56,.78);
      border:1px solid rgba(255,255,255,.16);
      backdrop-filter:blur(10px);
      box-shadow:0 10px 25px rgba(0,0,0,.12);
    }
    .lang-switcher a{
      display:grid;
      place-items:center;
      width:42px;
      height:42px;
      border-radius:999px;
      color:#fff;
      font-weight:700;
      font-size:1.2rem;
      background:rgba(255,255,255,.06);
      border:1px solid transparent;
      transition:transform .2s ease,border-color .2s ease;
    }
    .lang-switcher a:hover,
    .lang-switcher a:focus-visible{
      transform:translateY(-1px);
      border-color:rgba(255,255,255,.9);
      outline:none;
    }
    .lang-switcher a[aria-current="page"]{
      background:rgba(255,255,255,.12);
      border-color:rgba(255,255,255,.9);
    }
    .lang-switcher img{
      display:block;
      width:24px;
      height:18px;
      object-fit:cover;
      border-radius:2px;
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:30;
      background:rgba(16,42,56,.94);
      border-bottom:1px solid rgba(255,255,255,.1);
      backdrop-filter:blur(12px);
    }
    .topbar nav{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:6px;
      padding:12px 0;
    }
    .topbar a{
      color:rgba(255,255,255,.9);
      font-size:.82rem;
      font-weight:600;
      letter-spacing:.02em;
      padding:8px 12px;
      border-radius:999px;
      transition:background .2s ease,color .2s ease;
    }
    .topbar a:hover,
    .topbar a:focus-visible{
      background:rgba(255,255,255,.06);
      outline:none;
    }

    .hero{
      position:relative;
      min-height:520px;
      display:grid;
      place-items:center;
      overflow:hidden;
      background:
        linear-gradient(120deg, rgba(12,25,31,.74), rgba(12,29,36,.52)),
        url("images/hero.png") center/cover no-repeat;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .hero::before{
      content:"";
      position:absolute;
      inset:0;
      background:radial-gradient(circle at top right, rgba(199,166,106,.18), transparent 28%);
    }
    .hero-inner{
      position:relative;
      z-index:1;
      width:min(var(--container), calc(100% - 32px));
      display:grid;
      grid-template-columns:1.5fr .7fr;
      align-items:center;
      gap:38px;
      padding:100px 0 72px;
    }
    .eyebrow{
      display:inline-block;
      margin-bottom:18px;
      padding:7px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
      color:#edf5fb;
      font-size:.66rem;
      font-weight:700;
      letter-spacing:.14em;
      text-transform:uppercase;
    }
    h1,h2,h3{
      margin:0 0 12px;
      font-family:var(--heading);
      font-weight:500;
      line-height:1;
      letter-spacing:-.03em;
      color:var(--navy);
    }
    .hero h1{
      max-width:640px;
      font-size:clamp(2.8rem,4vw,5rem);
      color:#fff;
      text-shadow:0 14px 30px rgba(0,0,0,.18);
    }
    .hero p{
      margin:0;
      max-width:680px;
      color:rgba(255,255,255,.85);
      font-size:1rem;
    }
    .cta-row{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:24px;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:13px 18px;
      border-radius:12px;
      font-weight:700;
      transition:transform .2s ease,box-shadow .2s ease;
    }
    .btn:hover,
    .btn:focus-visible{
      transform:translateY(-1px);
      outline:none;
    }
    .btn-primary{
      background:linear-gradient(135deg,var(--gold),#b98d4d);
      color:var(--navy);
      box-shadow:0 18px 28px rgba(199,166,106,.22);
    }
    .btn-secondary{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.18);
      color:#fff;
    }

    .hero-card{
      justify-self:end;
      width:min(100%,340px);
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
      border-radius:22px;
      padding:22px 20px;
      box-shadow:0 18px 36px rgba(0,0,0,.12);
      backdrop-filter:blur(10px);
    }
    .hero-card .label{
      color:rgba(255,255,255,.72);
      text-transform:uppercase;
      letter-spacing:.12em;
      font-size:.62rem;
      font-weight:700;
      margin-bottom:10px;
    }
    .hero-card h2{
      font-size:clamp(1.65rem, 2vw, 2.2rem);
      color:#fff;
      margin-bottom:14px;
    }
    .hero-card ul{
      list-style:none;
      margin:0;
      padding:0;
      display:grid;
      gap:10px;
    }
    .hero-card li{
      display:flex;
      align-items:center;
      gap:12px;
      color:rgba(255,255,255,.9);
      font-size:.95rem;
    }
    .dot{
      width:9px;
      height:9px;
      border-radius:50%;
      background:linear-gradient(180deg,#f0d79d,#d7a95f);
      box-shadow:0 0 0 6px rgba(199,166,106,.1);
      flex-shrink:0;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:16px;
      width:min(var(--container), calc(100% - 32px));
      margin:-34px auto 0;
      position:relative;
      z-index:2;
    }
    .stat{
      background:rgba(255,255,255,.9);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:18px 14px;
      text-align:center;
    }
    .stat strong{
      display:block;
      font-family:var(--heading);
      font-size:clamp(1.8rem,2.5vw,2.8rem);
      color:var(--navy);
      line-height:1;
      margin-bottom:8px;
    }
    .stat span{
      color:var(--muted);
      font-size:.77rem;
      font-weight:700;
      letter-spacing:.05em;
      text-transform:uppercase;
    }

    main{
      padding:62px 0 80px;
    }
    section{
      margin-top:56px;
      scroll-margin-top:90px;
    }
    .intro{
      max-width:780px;
      margin:0 auto 20px;
      text-align:center;
    }
    .intro h2{
      font-size:clamp(2.3rem,3vw,3.5rem);
      margin-bottom:8px;
    }
    .intro p{
      margin:0;
      color:var(--muted);
      font-size:1rem;
    }

    .panel{
      background:rgba(255,255,255,.72);
      border:1px solid var(--line);
      border-radius:var(--radius-xl);
      box-shadow:0 14px 30px rgba(17,33,39,.04);
      padding:22px;
    }
    .highlight{
      margin:0 0 18px;
      padding:16px 18px;
      border-radius:14px;
      text-align:center;
      background:rgba(199,166,106,.08);
      border:1px solid rgba(199,166,106,.18);
      color:var(--navy);
      font-weight:700;
      font-size:.95rem;
    }

    .card-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:20px;
    }
    .card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:20px;
      padding:24px;
      box-shadow:0 10px 28px rgba(17,33,39,.03);
    }
    .card h3{
      font-size:clamp(1.7rem,2vw,2.2rem);
      color:var(--navy);
      margin-bottom:10px;
    }
    .card p,
    .card li,
    .faq-item p,
    .contact-box p{
      color:var(--muted);
      margin:0;
    }
    .card ul{
      margin:14px 0 0;
      padding-left:18px;
      display:grid;
      gap:8px;
    }

    .badges{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin:12px 0 14px;
    }
    .badge{
      display:inline-block;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(23,58,77,.1);
      background:rgba(23,58,77,.03);
      color:var(--navy);
      font-size:.68rem;
      font-weight:700;
      letter-spacing:.04em;
      text-transform:uppercase;
    }

    .gallery-card{
      position:relative;
      display:block;
      width:100%;
      margin-top:18px;
      padding:0;
      border:none;
      background:none;
      overflow:hidden;
      border-radius:18px;
      cursor:pointer;
      border:1px solid var(--line);
      box-shadow:0 16px 28px rgba(16,42,56,.08);
      transition:transform .2s ease,box-shadow .2s ease;
    }
    .gallery-card:hover,
    .gallery-card:focus-visible{
      transform:translateY(-2px);
      box-shadow:0 20px 32px rgba(16,42,56,.1);
      outline:none;
    }
    .gallery-card img{
      width:100%;
      height:280px;
      object-fit:cover;
      display:block;
    }
    .gallery-card__overlay{
      position:absolute;
      inset:auto 0 0 0;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:14px 16px;
      background:linear-gradient(180deg, rgba(10,20,24,0), rgba(10,20,24,.64) 55%, rgba(10,20,24,.82));
      color:#fff;
    }
    .gallery-card__overlay strong{
      display:block;
      font-size:clamp(1.4rem,2vw,1.8rem);
      font-family:var(--heading);
      line-height:1;
    }
    .gallery-card__overlay span{
      font-size:.7rem;
      letter-spacing:.08em;
      text-transform:uppercase;
      opacity:.9;
    }

    .faq{
      display:grid;
      gap:16px;
    }
    .faq-item{
      background:linear-gradient(180deg, rgba(255,255,255,.94), rgba(247,243,238,.8));
      border:1px solid var(--line);
      border-radius:18px;
      padding:20px 22px;
      box-shadow:0 10px 20px rgba(15,42,56,.02);
    }
    .faq-item h3{
      font-size:clamp(1.5rem,2vw,2rem);
      color:var(--navy);
      margin-bottom:7px;
    }

    .contact-grid{
      display:grid;
      grid-template-columns:1.05fr .95fr;
      gap:20px;
    }
    .contact-box{
      background:#fff;
      border:1px solid var(--line);
      border-radius:22px;
      padding:22px;
      box-shadow:var(--shadow);
    }
    .contact-box h3{
      font-size:clamp(2rem,2.8vw,2.6rem);
      color:var(--navy);
      margin-bottom:10px;
    }

    .contact-list{
      display:grid;
      gap:12px;
      margin-top:18px;
    }
    .contact-item{
      display:flex;
      align-items:flex-start;
      gap:12px;
    }
    .contact-item strong{
      display:block;
      color:var(--navy);
      margin-bottom:2px;
      font-size:.92rem;
    }
    .contact-item a{
      color:var(--navy-2);
      font-weight:600;
      overflow-wrap:anywhere;
    }

    .map{
      width:100%;
      min-height:280px;
      border:0;
      border-radius:16px;
      margin-top:12px;
      box-shadow:0 12px 24px rgba(16,42,56,.04);
    }

    .lightbox{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px 18px;
      opacity:0;
      visibility:hidden;
      pointer-events:none;
      transition:opacity .2s ease,visibility .2s ease;
      z-index:2000;
    }
    .lightbox.open{
      opacity:1;
      visibility:visible;
      pointer-events:auto;
    }
    .lightbox-backdrop{
      position:absolute;
      inset:0;
      background:rgba(12,18,22,.7);
      backdrop-filter:blur(4px);
    }
    .lightbox-dialog{
      position:relative;
      z-index:1;
      width:min(920px,100%);
      background:#fff;
      border-radius:22px;
      border:1px solid rgba(255,255,255,.12);
      box-shadow:0 26px 80px rgba(0,0,0,.2);
      overflow:hidden;
    }
    .lightbox-title{
      margin:0;
      padding:18px 22px 0;
      font-size:clamp(1.8rem,3vw,2.5rem);
      color:var(--navy);
    }
    .lightbox-close{
      position:absolute;
      top:12px;
      right:12px;
      width:38px;
      height:38px;
      border:none;
      border-radius:50%;
      background:rgba(21,44,57,.06);
      color:var(--navy);
      font-size:1.8rem;
      line-height:1;
      cursor:pointer;
    }
    .lightbox-stage{
      position:relative;
      display:grid;
      place-items:center;
      padding:16px 58px 20px;
      background:linear-gradient(180deg, rgba(247,245,241,.9), rgba(255,255,255,1));
    }
    .lightbox-stage img{
      width:100%;
      max-height:70vh;
      object-fit:contain;
      border-radius:16px;
      background:#f7f5f1;
    }
    .lightbox-nav{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      width:40px;
      height:40px;
      border:none;
      border-radius:50%;
      background:rgba(21,44,57,.88);
      color:#fff;
      font-size:1.8rem;
      line-height:1;
      cursor:pointer;
      box-shadow:0 12px 18px rgba(15,42,56,.12);
    }
    .lightbox-nav[data-direction="prev"]{left:12px}
    .lightbox-nav[data-direction="next"]{right:12px}
    .lightbox-caption{
      width:100%;
      margin:0;
      padding:8px 0 0;
      text-align:center;
      color:var(--muted);
      font-weight:600;
    }

    footer{
      background:linear-gradient(135deg,#152c39 0%, #0f212d 100%);
      color:rgba(255,255,255,.9);
      padding:26px 0 32px;
      margin-top:58px;
    }
    .footer-inner{
      width:min(var(--container), calc(100% - 32px));
      margin:0 auto;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:12px;
    }
    .footer-inner a{
      color:#e5f0f8;
      font-weight:600;
    }

    @media (max-width: 980px){
      .hero-inner,
      .card-grid,
      .contact-grid,
      .gallery-grid,
      .stats{
        grid-template-columns:1fr;
      }
      .hero-inner{
        padding-top:110px;
      }
      .hero-card{
        justify-self:start;
      }
      .topbar nav{
        justify-content:flex-start;
      }
    }

    @media (max-width: 640px){
      .lang-switcher{
        position:relative;
        top:auto;
        left:auto;
        width:max-content;
        margin:10px auto;
        padding:5px;
      }
      .hero{
        min-height:440px;
      }
      .cta-row{
        flex-direction:column;
        align-items:stretch;
      }
      .btn{
        width:100%;
      }
      .topbar nav{
        gap:4px;
        padding:8px 0;
      }
      .panel,.card,.contact-box{
        padding:18px;
      }
      .gallery-card img{
        height:220px;
      }
      .lightbox-stage{
        padding-inline:48px;
      }
      .lightbox-nav{
        width:32px;
        height:32px;
        font-size:1.5rem;
      }
    }
  </style>
</head>
